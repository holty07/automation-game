<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automation Game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: sans-serif; }
      #game { display: block; image-rendering: pixelated; background: #000; }

      .tutorial {
        position: fixed; left: 50%; top: 0; transform: translateX(-50%); max-width: 480px;
        background: #1b1b1b; border: 1px solid #444; padding: 8px 12px; box-sizing: border-box;
        font-size: 13px; display: flex; gap: 6px;
      }
      .tutorial-step { color: #5af; flex-shrink: 0; }

      .hover-info {
        position: fixed; pointer-events: none; z-index: 10; max-width: 240px;
        background: #1b1b1bee; border: 1px solid #444; padding: 6px 8px; box-sizing: border-box;
        font-size: 12px; white-space: pre-line;
      }

      .toolbar {
        position: fixed; left: 0; top: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        background: #1b1b1b; padding: 8px; box-sizing: border-box;
      }

      .bot-list { position: fixed; left: 0; top: 40px; width: 160px; background: #1b1b1b; padding: 8px; box-sizing: border-box; }
      .bot-list-row { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
      .bot-list-row.selected { outline: 2px solid #5af; }

      .script-editor {
        position: fixed; right: 0; top: 0; bottom: 0; width: 420px; overflow-y: auto; overflow-x: hidden;
        background: #1b1b1b; padding: 8px; box-sizing: border-box; font-size: 13px;
      }
      .script-editor-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
      .bot-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 8px; }
      .bot-controls input[type="text"] { width: 8em; }
      .bot-upgrade-error { color: #f55; }
      .instruction-counter { margin-bottom: 8px; }
      .instruction-counter.over-cap { color: #f55; }
      .instruction-row {
        display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 2px 0;
        border-top: 2px solid transparent; border-bottom: 2px solid transparent;
      }
      .instruction-row-active { background: #274; }
      .instruction-row.drop-before { border-top-color: #5af; }
      .instruction-row.drop-after { border-bottom-color: #5af; }
      .instruction-row.drop-into { outline: 2px dashed #fa5; }
      .drag-handle { cursor: grab; opacity: 0.6; }
      .arg-editor, .condition-editor { display: inline-flex; flex-wrap: wrap; gap: 4px; }
      .arg-editor select, .condition-editor select { max-width: 8em; }
      .arg-editor input[type="number"], .condition-editor input[type="number"] { width: 3.5em; }
      .instruction-row button { flex-shrink: 0; }
      .add-instruction-row { display: flex; gap: 4px; margin-top: 8px; }

      .generalise-review {
        position: fixed; left: 50%; top: 40px; transform: translateX(-50%); width: 420px;
        background: #1b1b1b; padding: 12px; box-sizing: border-box; font-size: 13px; border: 1px solid #444;
      }
      .generalise-summary { margin-bottom: 8px; }
      .generalise-error { color: #f55; margin-top: 8px; min-height: 1em; }
      .generalise-change-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 0; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
